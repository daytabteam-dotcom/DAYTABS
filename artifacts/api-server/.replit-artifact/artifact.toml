kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["bash", "-c", "NODE_ENV=production pnpm --filter @workspace/api-server run build && BASE_PATH=/ pnpm --filter @workspace/landing run build && BASE_PATH=/panel/ pnpm --filter @workspace/daytabs run build"]

[services.production.run]
args = ["sh", "scripts/start-api-and-worker.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
CORE_APP_URL = "/panel/"

[services.production.health.startup]
path = "/api/healthz"
